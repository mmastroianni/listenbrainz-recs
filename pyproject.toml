[project]
name = "listenbrainz-recs"
version = "0.1.0"
description = "Artist recommendations from ListenBrainz listening data via ALS collaborative filtering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu",
    "fastapi",
    "numpy",
    "pandas",
    "pyarrow",
    "pyspark",
    "scikit-learn",
    "scipy",
    "umap-learn",
    "uvicorn",
]

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
